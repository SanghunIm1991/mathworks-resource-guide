<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 852" width="1200" height="852" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="カバレッジの考え方（判定・条件・MC/DC）の概念図。中央に例の式 out = A &amp;&amp; (B || C) と、その真理値表の8行（列は 行・A・B・C・B||C・out）。値は、行1: 0 0 0 0 0、行2: 0 0 1 1 0、行3: 0 1 0 1 0、行4: 0 1 1 1 0、行5: 1 0 0 0 0、行6: 1 0 1 1 1、行7: 1 1 0 1 1、行8: 1 1 1 1 1。表の右に、各カバレッジを満たすテストの組で選ぶ行の印を、別々の列で示す。判定の列は行1と行8。条件の列は行4と行5で、判定は50%にとどまる。MC/DCの列は行3・5・6・7で、その右の「独立の組」の小列で、組の2行を線で結ぶ。Aは行3と行7、Bは行5と行7、Cは行5と行6。その下に左から右への道のり、判定、条件、MC/DC、拡張MCDC。右ほど強い・テストが増える。判定から点線で分岐して、関係演算子の境界（比較の境目）。最下部の土台の帯は、Simulink Coverage（測る）・Simulink Design Verifier（作る、ModelCoverageObjectives）。">
