<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="ニューラル状態空間モデルのしくみと使い方の概要図。上段は使う手順の5段階で、【1】データを集める（状態の計測値が要る）、【2】構造を決める（idNeuralStateSpace）、【3】学習（nlssest、軌跡を比べる）、【4】検証（学習に使わない実験）、【5】使う（sim・linearize・関数の生成・Simulinkのブロック）の順に進む。中段はモデルの中身で、入力 u と状態 x を状態のネットワーク F（StateNetwork）に入れて dx/dt（状態の微分）を出し、ODEソルバーで積分して状態 x に戻るループになっている。状態 x からは、固定の写像で出力 y1 = x を出し、出力のネットワーク H（OutputNetwork の2つ目）で出力 y2 を出す。【2】で構造を決め、【3】で F と H を学習する。下段の土台は、前提知識（状態空間・微分方程式・ニューラルネットワーク）・System Identification Toolbox・Deep Learning Toolbox。">
