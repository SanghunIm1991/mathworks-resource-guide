<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 848" width="1200" height="848" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="Reduced Order Modelerで重いモデルを軽いROMにする流れの概念図。中央は対比で、同じ入力を、左の重い元のモデル（FEM・CFD等。1回の計算が遅い）と右の軽いROMの両方に入れると、出力の波形がほぼ重なる。その下に左から右へ5段階の道のり。1 入出力を選ぶ（Select ROM I/Os）、2 実験を設定する（信号・範囲・境界）、3 シミュレーション（Run Simulations）、4 学習して比べる（LSTM・NSS等・TestMSE）、5 書き出す（Simulinkのブロック・正規化）。最下部の土台の帯は、アドオン（R2025b以降）・Simulink・静的なROMと動的なROM。">
<title id="g03b-title">Reduced Order Modelerで重いモデルを軽いROMにする流れの概念図。中央は対比で、同じ入力を、左の重い元のモデル（FEM・CFD等。1回の計算が遅い）と右の軽いROMの両方に入れると、出力の波形がほぼ重なる。その下に左から右へ5段階の道のり。1 入出力を選ぶ（Select ROM I/Os）、2 実験を設定する（信号・範囲・境界）、3 シミュレーション（Run Simulations）、4 学習して比べる（LSTM・NSS等・TestMSE）、5 書き出す（Simulinkのブロック・正規化）。最下部の土台の帯は、アドオン（R2025b以降）・Simulink・静的なROMと動的なROM。</title>
