<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 752" width="1200" height="752" role="img" aria-label="現代制御の数学の概要図。中央は出力フィードバックの閉ループで、プラント ẋ = Ax + Bu の出力 y をオブザーバー（ゲイン L）に入れて推定した状態 x̂ を求め、−K を掛けた入力 u をプラントに戻す。その下に学ぶ道のりを左から右へ6段階で示す。1 固有値で安定性（eig・isstable）、2 可制御性（ctrb）、3 極配置・LQR で K を決める（place・lqr）、4 可観測性（obsv）、5 オブザーバー・カルマンフィルターで L を決める（place・kalman）、6 LQG で K と L を組み合わせる（lqgreg・lqg）。K と L はループと段階で同じ色にしている。土台は線形代数の道具（固有値・階数・2次形式・正定値）とControl System Toolbox。" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif">
<title id="g04a-title">現代制御の数学（概要図）</title>
