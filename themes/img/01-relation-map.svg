<text x="32.0" y="792.0" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">【5】コンフィギュレー</text>
<text x="32.0" y="810.0" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">ション</text>
<text x="457.0" y="123.0" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">プログラムによるモデル化の基礎</text>
