<text x="32.0" y="430.0" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">【3】ブロックの検索</text>
<text x="32.0" y="594.0" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">【4】ブロック・線の追</text>
