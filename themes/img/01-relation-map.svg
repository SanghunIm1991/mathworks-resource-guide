<text x="315.0" y="75.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">概要</text>
<text x="565.0" y="75.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">チュートリアル</text>
<text x="815.0" y="75.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">サンプル</text>
