<text x="32.0" y="120.0" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">【1】全体像と基本の流</text>
<text x="32.0" y="138.0" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">れ</text>
<text x="32.0" y="282.0" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">【2】パラメーターの読</text>
